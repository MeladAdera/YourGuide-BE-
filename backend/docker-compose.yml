name: your-guide

services:
  postgres:
    # The plan asks for PostgreSQL 15 or newer.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: your_guide
      POSTGRES_PASSWORD: your_guide
      POSTGRES_DB: your_guide_dev
    ports:
      # Host port 5433, so it never clashes with another local PostgreSQL on 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only the first time the volume is created: adds your_guide_test.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U your_guide -d your_guide_dev']
      interval: 2s
      timeout: 3s
      retries: 15

  # A database viewer in the browser: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4
    environment:
      # Required by the image, but never asked for: SERVER_MODE False
      # opens pgAdmin without a login page.
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      # 127.0.0.1 only: there is no login, so it must not be reachable
      # from other devices on the network.
      - '127.0.0.1:5050:80'
    volumes:
      # Registers the "Your Guide (local)" server the first time it starts.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
